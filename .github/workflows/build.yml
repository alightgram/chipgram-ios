name: Build ChipGram IPA

on:
  push:
    branches: [ chipgram ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chipgram-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Free disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Caches" || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          df -h /

      - name: Set active Xcode path
        run: |
          set -x
          PREFERRED=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          if [ -d "/Applications/Xcode_${PREFERRED}.app" ]; then
            CHOICE="/Applications/Xcode_${PREFERRED}.app"
          elif ls -d /Applications/Xcode_27*.app >/dev/null 2>&1; then
            CHOICE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          elif ls -d /Applications/Xcode_26*.app >/dev/null 2>&1; then
            CHOICE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          else
            CHOICE=$(xcode-select -p | sed 's#/Contents/Developer$##')
          fi
          echo "Using Xcode at: $CHOICE"
          sudo xcode-select -s "$CHOICE/Contents/Developer"
          xcodebuild -version

      - name: Restore executable bits
        run: |
          set -euo pipefail
          # Windows checkouts lose the POSIX executable bit; restore it for every
          # tracked script (Bazel genrules invoke them directly).
          git ls-files -z '*.sh' | xargs -0 chmod +x || true
          git ls-files -z | xargs -0 grep -Il '^#!' 2>/dev/null | tr '\n' '\0' | xargs -0 chmod +x || true
          ls -l submodules/ffmpeg/Sources/FFMpeg/build-ffmpeg-bazel.sh

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -euo pipefail

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          # Keep the executable bits on the copied tree as well.
          git ls-files -z '*.sh' | xargs -0 chmod +x || true
          git ls-files -z | xargs -0 grep -Il '^#!' 2>/dev/null | tr '\n' '\0' | xargs -0 chmod +x || true

          ulimit -n 65536 || true

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building ChipGram $APP_VERSION ($BUILD_NUMBER)"

          export TELEGRAM_CODESIGNING_P12_PASSWORD=chipgram
          python3 -u build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

          ls -la build/artifacts

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChipGram-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: ChipGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            ChipGram РґР»СЏ iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}) вЂ” СЃР±РѕСЂРєР° РґР»СЏ telesrv 48.102.163.176:2398.
            РЎРµСЂРІРµСЂ: DC2, RSA-РєР»СЋС‡ telesrv РІСЃС‚СЂРѕРµРЅ РІ РєР»РёРµРЅС‚.
            РЈСЃС‚Р°РЅРѕРІРєР°: РїРѕРґРїРёСЃР°С‚СЊ С‡РµСЂРµР· esign / AltStore / TrollStore.
          files: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          fail_on_unmatched_files: true
